[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pawcut-core = { path = "crates/pawcut-core" }
paw-media = { path = "crates/paw-media" }
pawcut-render = { path = "crates/pawcut-render" }
pawcut-export = { path = "crates/pawcut-export" }
paw-testkit = { path = "crates/paw-testkit" }
paw-ui = { path = "crates/paw-ui" }
paw-audio = { path = "crates/paw-audio" }
pawvoice-core = { path = "crates/pawvoice-core" }
pawwrite-core = { path = "crates/pawwrite-core" }
pawpaint-core = { path = "crates/pawpaint-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tempfile = "3"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "filter", "software-scaling"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
cosmic-text = "0.19"
rayon = "1"
lru = "0.18"
