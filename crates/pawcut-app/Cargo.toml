[package]
name = "pawcut-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "pawcut"
path = "src/main.rs"

[dependencies]
pawcut-core.workspace = true
paw-media.workspace = true
pawcut-render.workspace = true
pawcut-export.workspace = true
paw-ui.workspace = true
paw-audio.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
rustfft = "6"
eframe = "0.36"
egui = { version = "0.36", features = ["serde"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
winit = { version = "0.30", default-features = false, features = ["x11"] }
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

[dev-dependencies]
tempfile.workspace = true
egui_kittest = { version = "0.36", features = ["eframe"] }
paw-testkit.workspace = true
